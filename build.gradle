plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Jars locais (Vivecraft) ficam na pasta libs/ ao lado do projeto (o mesmo jar do perfil Fabulously Optimized).
def sharedLibs = rootProject.file("../libs")
def vivecraftJar = "${sharedLibs}/vivecraft-${project.vivecraft_version}-fabric.jar"

configurations {
    // Mods usados só no teste de produção (prodClient), como no modpack.
    productionMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // Minecraft 26.x não é ofuscado: sem "mappings", tudo com os nomes oficiais da Mojang.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Vivecraft (o mesmo jar do modpack). Só para compilar: no jogo quem fornece é o próprio Vivecraft.
    compileOnly files(vivecraftJar)

    productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Mods do jogo de teste. Com -Pmodpack=<pasta "mods" de um perfil> (ex.: o Fabulously Optimized do Modrinth), o teste
// roda com os mods desse perfil (Sodium, Iris, Vivecraft...) no lugar de só Fabric API + Vivecraft — o ambiente real.
// Ficam de fora o HandsOn do perfil (o testado é o recém-compilado), o Essential (pede conta da Microsoft) e o
// Crash Assistant (abre um programa à parte quando o jogo cai e trava arquivos da pasta do teste).
def testMods = { task ->
    task.mods.from(tasks.named("jar"))
    if (project.hasProperty("modpack")) {
        task.mods.from(fileTree(project.property("modpack").toString()) {
            include "*.jar"
            exclude "handsonvr*", "Essential*", "essential*", "CrashAssistant*"
        })
    } else {
        task.mods.from(configurations.productionMods)
        task.mods.from(files(vivecraftJar))
    }
}

// Teste automático (dev.SelfTest): "gradlew prodClient" abre o jogo, roda o roteiro com o VR simulado e fecha
// sozinho. Relatório em run-prod/handsonvr-selftest.txt e prints em run-prod/screenshots/.
tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    testMods(it)
    jvmArgs.addAll("-Dhandsonvr.selftest=true", "-Xmx4G")
    programArgs.addAll("--width", "1280", "--height", "720")
    runDir = layout.projectDirectory.dir("run-prod")
}

// Ligação com os controles do Vivecraft: o Vivecraft roda o VR de verdade com o "VR nulo" (sem óculos; ver
// run-prod-nullvr/config/vivecraft-client-config.json) e o teste dispara os avisos de grip/gatilho/botões.
tasks.register("prodClientNullVr", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    testMods(it)
    jvmArgs.addAll("-Dhandsonvr.selftest=true", "-Dhandsonvr.selftest.nullvr=true", "-Xmx4G")
    programArgs.addAll("--width", "1280", "--height", "720")
    runDir = layout.projectDirectory.dir("run-prod-nullvr")
}

// Mundo de testes para jogar em VR (dev.TestWorld): "gradlew prodClientWorld" monta "HandsOn VR - Testes" em
// run-prod/saves e fecha o jogo. Depois é só copiar a pasta para os saves do perfil do Modrinth.
tasks.register("prodClientWorld", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    testMods(it)
    jvmArgs.addAll("-Dhandsonvr.testworld=true", "-Xmx4G")
    programArgs.addAll("--width", "1280", "--height", "720")
    runDir = layout.projectDirectory.dir("run-prod")
}

// Opcional: rodar os testes com outro Java 25 (ex.: o Azul Zulu que o Modrinth usa no perfil):
//   gradlew prodClient -PtestJavaVendor=Azul -Porg.gradle.java.installations.paths=<pasta do Java>
if (project.hasProperty("testJavaVendor")) {
    def vendorName = project.property("testJavaVendor").toString()
    tasks.withType(net.fabricmc.loom.task.prod.ClientProductionRunTask).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.matching(vendorName)
        }
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}
