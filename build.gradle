plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// Os jars locais (Vivecraft, e para o teste conjunto o CobbleVR/Cobblemon) ficam na pasta libs/ do CobbleVR.
def sharedLibs = rootProject.file("../libs")

configurations {
    // Mods usados só no teste de produção (prodClient), sem conversão de nomes — como no modpack.
    productionMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Vivecraft (o mesmo jar do modpack). Só para compilar: no jogo quem fornece é o próprio Vivecraft.
    modCompileOnly files("${sharedLibs}/vivecraft-1.21.1-1.3.15-fabric.jar")
    modLocalRuntime files("${sharedLibs}/vivecraft-1.21.1-1.3.15-fabric.jar")

    productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Teste automático (dev.SelfTest): "gradlew prodClient" abre o jogo como no modpack (Vivecraft + Fabric API + o
// .jar final do mod), roda o roteiro com o VR simulado e fecha sozinho. Relatório em run-prod/handsonvr-selftest.txt
// e prints em run-prod/screenshots/.
tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named("remapJar"))
    mods.from(configurations.productionMods)
    mods.from(files("${sharedLibs}/vivecraft-1.21.1-1.3.15-fabric.jar"))
    jvmArgs.add("-Dhandsonvr.selftest=true")
    programArgs.addAll("--width", "1280", "--height", "720")
    runDir = layout.projectDirectory.dir("run-prod")
}

// Ligação com os controles do Vivecraft: o Vivecraft roda o VR de verdade com o "VR nulo" (sem óculos; ver
// run-prod-nullvr/config/vivecraft-client-config.json) e o teste dispara os avisos de grip/gatilho/analógico.
tasks.register("prodClientNullVr", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named("remapJar"))
    mods.from(configurations.productionMods)
    mods.from(files("${sharedLibs}/vivecraft-1.21.1-1.3.15-fabric.jar"))
    jvmArgs.addAll("-Dhandsonvr.selftest=true", "-Dhandsonvr.selftest.nullvr=true")
    programArgs.addAll("--width", "1280", "--height", "720")
    runDir = layout.projectDirectory.dir("run-prod-nullvr")
}

// O mesmo teste junto com o CobbleVR (cinto de Pokébolas na cintura) e o Cobblemon: os coldres não podem brigar com
// o cinto pelo grip.
tasks.register("prodClientCobbleVR", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named("remapJar"))
    mods.from(configurations.productionMods)
    mods.from(files(
            "${sharedLibs}/vivecraft-1.21.1-1.3.15-fabric.jar",
            "${sharedLibs}/Cobblemon-fabric-1.7.3+1.21.1.jar",
            "${sharedLibs}/fabric-language-kotlin-1.13.13+kotlin.2.4.10.jar",
            rootProject.file("../build/libs/cobblevr-1.0.0-alpha.jar")))
    jvmArgs.add("-Dhandsonvr.selftest=true")
    programArgs.addAll("--width", "1280", "--height", "720")
    runDir = layout.projectDirectory.dir("run-prod-cobblevr")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
